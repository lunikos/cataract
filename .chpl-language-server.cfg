# Module search path for editors. Mirrors the -M list Build.chpl passes to chpl
# (RUNTIME_SUBDIRS), plus each example's lib directory, so `use Cataract;` and
# `use PostStore;` resolve without building. Not read by the compiler.
module-dir:
  - src/runtime
  - src/runtime/net
  - src/runtime/http
  - src/runtime/router
  - src/runtime/render
  - src/runtime/middleware
  - src/runtime/util
  - src/cli
  - src/compiler
  - examples/api/app/lib
  - examples/blog/app/lib
  - examples/dashboard/app/lib
  - examples/docs/app/lib
