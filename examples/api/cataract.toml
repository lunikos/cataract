[project]
name = "tasks-api"
version = "0.1.0"

[paths]
app = "app"
routes = "app/routes"
lib = "app/lib"
db = "app/db"
out = ".cataract"
dist = "dist"
runtime = "../../src/runtime"

[server]
host = "127.0.0.1"
port = 3001
max_concurrency = 512
max_body_bytes = 65536
keep_alive_ms = 5000
header_timeout_ms = 10000
log_level = "info"

# Rows live here between runs; leave it unset for an in-memory table.
[database]
path = "data"

[build]
optimize = true

# Groups are matched by path prefix; the stages run in the order they are named.
[middleware]
groups = "api"

[middleware.api]
match = "/tasks"
use = "cors, rate-limit"
cors_origins = "https://tasks.example"
cors_credentials = false
rate_limit_requests = 30
rate_limit_window_ms = 10000
rate_limit_burst = 10

# A service that returns no markup advertises nowhere to load any from.
[security]
csp = "default-src 'none'; frame-ancestors 'none'"
hsts_seconds = 0
allowed_origins = ""
