version: "0.2"

# Prose in this project is British-spelled (behaviour, sanitised, serialise),
# which is what en-GB is here for rather than a list of every such word.
language: en,en-GB

ignorePaths:
  - .cataract/**
  - dist/**
  - bin/**
  - assets/**

words:
  # Chapel toolchain and language
  - chpl
  - chplcheck
  - codegen
  - deinit
  - qthreads
  - writeln

  # POSIX, libc and the C interop boundary
  - cstr
  - eaddrinuse
  - eagain
  - epipe
  - errno
  - getenv
  - isatty
  - memcpy
  - nodelay
  - nonblock
  - nonblocking
  - rcvtimeo
  - reuseaddr
  - reuseport
  - sigpipe
  - sockaddr
  - strerror
  - timeval

  # HTTP, HTML and asset handling
  - backpressure
  - codepoint
  - codepoints
  - hsts
  - middot
  - nosniff
  - stylesheet
  - webp

  # WebSockets, CORS and CSRF
  - csrf
  - preflight
  - resync
  - subprotocol
  - subprotocols
  - unmasked
  - urandom
  - websocket
  - websockets

  # SQL and the generated data layer
  - autoincrement
  - sqls
  - urlencoded

  # Rendering, hydration and the mutation protocol
  - hydratable
  - opcode
  - opcodes
  - reconciler

  # Identifiers in this codebase
  - millis
  - redeployable
  - rfind
  - segs
  - subdirs
