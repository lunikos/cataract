# chplcheck defaults assume library conventions this project does not follow.
# Everything disabled here is a deliberate convention, not an unfixed warning.
disable-rule:
  # Records are PascalCase throughout, and Context, Request, Response,
  # MarkupBuilder and PageMeta are the documented public API. Renaming them to
  # camelCase would be a breaking API change.
  - CamelCaseRecords
  # Handler signatures are fixed by the framework: page(ctx, meta),
  # layout(ctx, slot, meta), get(ctx), Middleware.before/after(ctx, res). A
  # handler that never reads ctx still has to declare it.
  - UnusedFormal

# The codebase is written to 100 columns, not chplcheck's default 80.
setting: LineLength.Max=100

# Emitted by `cataract build`; gitignored, and not ours to lint.
skip: "**/.cataract/**"
